<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Cliente</title>
  <link rel="stylesheet" href="css/cliente.css" />
</head>
<body>
  <!-- Menú hamburguesa -->
  <div class="hamburger" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <!-- Botón de replegar -->
    <button class="close-btn" onclick="toggleSidebar()">←</button>
    <button onclick="verPerfil()">👤 Ver perfil</button>
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
  </div>

  <!-- Panel central -->
  <div class="main">
    <h1>Bienvenido <span id="username">Cliente</span></h1>
    <p>Te invitamos a explorar el evento <strong>XXXXXXX</strong></p>

    <!-- Botones principales en vertical -->
    <div class="actions">
      <button onclick="conocerInvitados()">👥 Conoce a los invitados</button>
      <button onclick="agendarCita()">📅 Agenda cita con otros invitados</button>
      <button onclick="responderEncuestas()">📝 Responde encuestas asignadas</button>
    </div>
  </div>

  <script>
    // Función para abrir/cerrar el menú lateral
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    // Funciones de botones del menú
    function verPerfil() {
      alert("Aquí se mostraría la información del perfil del usuario.");
    }

    function cerrarSesion() {
      window.location.href = "/index.html"; // redirige al login
    }

    // Funciones de botones principales
    function conocerInvitados() {
      alert("Función para conocer a los invitados.");
    }

    function agendarCita() {
      alert("Función para agendar cita con otros invitados.");
    }

    function responderEncuestas() {
      alert("Función para responder encuestas asignadas.");
    }
  </script>
</body>
</html>
